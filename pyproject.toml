[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "account-bot"
version = "0.1.0"
description = "Read-only multi-broker portfolio management Telegram bot"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot[job-queue]==22.8",
    "SQLAlchemy[asyncio]==2.0.51",
    "aiosqlite==0.22.1",
    "httpx>=0.28,<0.29",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "tzdata==2026.3",
]

[project.optional-dependencies]
market = [
    "exchange-calendars>=4.13.2,<5",
    "yfinance>=1.5.2,<2",
]
dev = [
    "pytest>=9.1,<10",
    "pytest-asyncio>=1.4,<2",
    "ruff>=0.16.2,<0.17",
]

[project.scripts]
account-bot = "account_bot.cli:main"
account-bot-web = "account_bot.web_api.app:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["account_bot*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
