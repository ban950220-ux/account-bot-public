name: Deploy Worker

# Manual only. Uses `versions upload` + `versions deploy` so cron triggers and
# Worker secrets are never rewritten. No Telegram message is sent.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "check: read-only status · deploy: test, upload and deploy master · rollback: redeploy version_id · migrate: apply one additive D1 migration"
        type: choice
        options: [check, deploy, rollback, migrate]
        default: check
        required: true
      version_id:
        description: "rollback only: Worker version ID to put back at 100%"
        type: string
        required: false
      migration:
        description: "migrate only: file name in deploy/cloudflare/migrations (e.g. 2026-11-21-plan-archive.sql)"
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: deploy-worker-production
  cancel-in-progress: false

env:
  CONFIG: deploy/cloudflare-js/wrangler.production.json
  WORKER: account-bot-production
  WRANGLER_SEND_METRICS: "false"
  # Public repository: Actions logs are public. Strip e-mail addresses from tool output.
  REDACT: 's/[[:alnum:]._%+-]+@[[:alnum:].-]+\.[[:alpha:]]+/[email]/g'

jobs:
  test:
    name: Worker tests
    if: inputs.action == 'deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test D1 and Worker contracts without external calls
        env:
          NODE_OPTIONS: --import=./tests/cloud_deny_network.mjs
        run: node --test tests/cloud_js_*.test.mjs

  cloudflare:
    name: ${{ inputs.action }}
    needs: test
    if: >-
      always() && github.ref == 'refs/heads/master' &&
      (needs.test.result == 'success' || needs.test.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ACTION: ${{ inputs.action }}
      VERSION_ID: ${{ inputs.version_id }}
      MIGRATION: ${{ inputs.migration }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned wrangler
        run: npm ci --no-audit --no-fund

      - name: Check credentials and current deployment
        run: |
          set -euo pipefail
          api() { curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID$1"; }
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            https://api.cloudflare.com/client/v4/user/tokens/verify | jq -r '"토큰 상태: \(.result.status)"'
          api "/workers/scripts/$WORKER/deployments" > deployments.json
          jq -r '.result.deployments | sort_by(.created_on) | last | "현재 배포: \(.created_on) · " +
            ([.versions[] | "\(.version_id) \(.percentage)%"] | join(", "))' deployments.json
          jq -r '.result.deployments | sort_by(.created_on) | last | .versions[0].version_id' \
            deployments.json > previous.txt
          sub=$(api /workers/subdomain | jq -r '.result.subdomain')
          echo "WORKER_URL=https://$WORKER.$sub.workers.dev" >> "$GITHUB_ENV"
          echo "Worker URL: https://$WORKER.$sub.workers.dev"
          npx wrangler versions list --config "$CONFIG" 2>&1 | sed -E "$REDACT" | tail -n 30

      - name: Upload and deploy
        if: inputs.action == 'deploy'
        run: |
          set -euo pipefail
          out=$(npx wrangler versions upload --config "$CONFIG" \
            --message "github ${GITHUB_SHA::7}" 2>&1) || { echo "$out" | sed -E "$REDACT"; exit 1; }
          echo "$out" | sed -E "$REDACT"
          id=$(echo "$out" | grep -oE 'Worker Version ID: [0-9a-f-]{36}' | awk '{print $4}')
          test -n "$id" || { echo "새 버전 ID를 찾지 못했습니다"; exit 1; }
          echo "TARGET_VERSION=$id" >> "$GITHUB_ENV"
          echo "되돌리기용 직전 버전: $(cat previous.txt)"
          npx wrangler versions deploy "$id@100%" --config "$CONFIG" \
            --message "github ${GITHUB_SHA::7}" --yes 2>&1 | sed -E "$REDACT"

      - name: Roll back
        if: inputs.action == 'rollback'
        run: |
          set -euo pipefail
          [[ "$VERSION_ID" =~ ^[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}$ ]] ||
            { echo "version_id는 전체 UUID여야 합니다"; exit 1; }
          echo "TARGET_VERSION=$VERSION_ID" >> "$GITHUB_ENV"
          echo "되돌리기 전 버전: $(cat previous.txt)"
          npx wrangler versions deploy "$VERSION_ID@100%" --config "$CONFIG" \
            --message "github rollback" --yes 2>&1 | sed -E "$REDACT"

      # Additive migrations only. A Time Travel bookmark taken first is the restore
      # point; no data is exported (logs of this public repository are public).
      # Only row counts and object names are printed.
      - name: Apply D1 migration
        if: inputs.action == 'migrate'
        run: |
          set -euo pipefail
          [[ "$MIGRATION" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}-[a-z0-9-]+\.sql$ ]] ||
            { echo "migration은 deploy/cloudflare/migrations 안의 파일 이름이어야 합니다"; exit 1; }
          file="deploy/cloudflare/migrations/$MIGRATION"
          test -f "$file" || { echo "$file 이 없습니다"; exit 1; }
          # Statements may only create; trigger bodies may only abort.
          if grep -Eiq '^[[:space:]]*(DROP|DELETE|UPDATE|ALTER|INSERT|REPLACE|PRAGMA)\b' "$file" ||
             grep -Ei '\bBEGIN\b' "$file" | grep -Evq "^BEGIN SELECT RAISE\(ABORT,'[^']*'\); END;$"; then
            echo "추가 전용 migration만 허용합니다"; exit 1
          fi
          db=$(jq -r '.d1_databases[0].database_name' "$CONFIG")
          d1() { npx wrangler d1 execute "$db" --remote --config "$CONFIG" --json --command "$1" 2>/dev/null |
            jq -c '.[0].results'; }
          counts="SELECT (SELECT COUNT(*) FROM cloud_plans) AS plans,
            (SELECT COUNT(*) FROM cloud_plan_revisions) AS revisions,
            (SELECT COUNT(*) FROM cloud_outbox) AS outbox,
            (SELECT COUNT(*) FROM sqlite_master) AS objects"
          bookmark=$(npx wrangler d1 time-travel info "$db" --config "$CONFIG" --json 2>/dev/null | jq -r '.bookmark')
          test -n "$bookmark" && [ "$bookmark" != null ] || { echo "Time Travel 복원 지점을 얻지 못했습니다"; exit 1; }
          echo "복원 지점(bookmark): $bookmark"
          before=$(d1 "$counts"); echo "적용 전: $before"
          npx wrangler d1 execute "$db" --remote --config "$CONFIG" --file "$file" --yes 2>&1 |
            sed -E "$REDACT" | grep -v -i 'proxy'
          after=$(d1 "$counts"); echo "적용 후: $after"
          for key in plans revisions; do
            [ "$(jq ".[0].$key" <<<"$before")" = "$(jq ".[0].$key" <<<"$after")" ] ||
              { echo "$key 행 수가 바뀌었습니다"; exit 1; }
          done
          created=$(grep -Eo 'CREATE (TABLE|INDEX|TRIGGER) IF NOT EXISTS [a-z0-9_]+' "$file" | awk '{print $NF}')
          for name in $created; do
            found=$(d1 "SELECT COUNT(*) AS n FROM sqlite_master WHERE name = '$name'" | jq '.[0].n')
            [ "$found" = 1 ] || { echo "$name 이 생기지 않았습니다"; exit 1; }
            echo "확인: $name"
          done

      - name: Verify production
        if: inputs.action == 'deploy' || inputs.action == 'rollback'
        run: |
          set -euo pipefail
          api() { curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID$1"; }
          # The deployments list can lag a few seconds behind `versions deploy`.
          live=""
          for i in 1 2 3 4 5 6; do
            live=$(api "/workers/scripts/$WORKER/deployments" |
              jq -r '.result.deployments | sort_by(.created_on) | last | .versions |
                select(length == 1) | .[0] | select(.percentage == 100) | .version_id')
            [ "$live" = "$TARGET_VERSION" ] && break
            echo "아직 반영 전 ($live), 10초 후 다시 확인"
            sleep 10
          done
          test "$live" = "$TARGET_VERSION" || { echo "100% 버전이 $live 입니다 (기대: $TARGET_VERSION)"; exit 1; }
          echo "운영 100%: $live"
          # Unauthenticated POST must be refused (403); 503 means config is broken.
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
              -H 'content-type: application/json' --data '{}' "$WORKER_URL/telegram/webhook")
            echo "webhook 무인증 POST: $code"
            [ "$code" = 403 ] && exit 0
            sleep 10
          done
          exit 1
